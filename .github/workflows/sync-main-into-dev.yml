name: Sync main into dev

# After every release reaches main and deploys (CI on main passed), bring main's merge commit into
# dev, so the next release pull request isn't "out-of-date with the base branch" (docs/deployment.md
# in the workspace → Releases). It opens a pull request from a branch made from dev with main merged
# in (no file changes) and turns on auto-merge with a merge commit, so it merges itself once the
# required checks pass. Never a push straight to dev.
#
# It needs the SYNC_TOKEN secret: a fine-grained token of the owner's with Contents and Pull
# requests (read and write) on this repository. A pull request opened with the workflow's own
# GITHUB_TOKEN would never start the required checks, so it could never merge.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-main-into-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check the token is set
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Add the SYNC_TOKEN secret (see the top of this workflow)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Open the sync pull request and let it merge itself
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev already has everything on main."
            exit 0
          fi
          branch="chore/sync-main-$(git rev-parse --short=7 origin/main)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch is already open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch" origin/dev
          git merge --no-ff origin/main -m "chore: sync main into dev"
          git push origin "$branch"
          gh pr create --base dev --head "$branch" \
            --title "chore: sync main into dev" \
            --body "Opened by the Sync main into dev workflow after a release reached main. Brings main's merge commit into dev; no file changes. Merges itself with a merge commit once the checks pass."
          gh pr merge "$branch" --auto --merge --delete-branch
